[project]
name = "mcpsum-e2e"
version = "0.1.0"
description = "End-to-end and adversarial tests for mcpsum"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
markers = [
    "interop: talks to official MCP reference servers fetched from npm/PyPI (network required)",
]
