version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Supply-chain hygiene: let new releases age a week before adopting them,
    # so a compromised publish has time to be detected and yanked.
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
