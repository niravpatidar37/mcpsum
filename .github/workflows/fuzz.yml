name: fuzz

on:
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * *" # nightly long run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [monitor_session, lock_parse, framing, escape_untrusted]
    env:
      # cargo-fuzz needs nightly (sanitizers). Pinned to a dated nightly for
      # reproducibility; bump deliberately.
      NIGHTLY: nightly-2026-09-30
      TARGET: ${{ matrix.target }}
      # 60 s smoke run on PRs, 15 min per target on the nightly schedule.
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '900' || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - name: Install cargo-fuzz
        run: cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz
        run: cargo +"$NIGHTLY" fuzz run "$TARGET" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
