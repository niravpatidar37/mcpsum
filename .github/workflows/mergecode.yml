name: mergecode

# Advisory merge-worthiness review of every PR by MergeCode
# (https://github.com/niravpatidar37/mergecode), posted as one sticky comment.
#
# Trust model:
#   * MergeCode is fetched at a pinned commit (MERGECODE_SHA) and its config
#     (mergecode.yaml) is read from the PR's BASE commit, so a PR can change
#     neither the judge nor its rules for itself.
#   * The `judge` job runs PR code (verification commands) with a read-only
#     token and no secrets; MergeCode also scrubs secret-looking and runner
#     file-command env vars from those commands.
#   * The `comment` job holds `pull-requests: write` but never runs PR code,
#     treats the report as untrusted text, and is skipped for fork PRs.
#   * Fails closed on REJECT, error, or a missing report; REQUEST_CHANGES is advisory.
#   * The verdict is NOT a security boundary: PR code runs in the same job that
#     writes the report, so a malicious same-repo PR could forge it. Keep this
#     check out of required status checks until verification is isolated (#24).

on:
  pull_request:

permissions: {}

concurrency:
  group: mergecode-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bump deliberately (Dependabot does not track this). Fetched by exact SHA below.
  MERGECODE_SHA: f69293ec74c9fef95f6c582f84c1b0b062dae3a6

jobs:
  judge:
    name: mergecode judge
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # refs/pull/N/merge plus its first parent (the base tip).
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 reached end-of-life in April 2026. MergeCode's CI tests 20 and 22.
          node-version: 22

      - name: Prepare base worktree, PR diff and task
        env:
          TASK_TITLE: ${{ github.event.pull_request.title }}
          TASK_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          git -c core.quotePath=false diff --binary HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          printf '%s\n\n%s\n' "$TASK_TITLE" "$TASK_BODY" > "$RUNNER_TEMP/task.md"
          mkdir -p "$RUNNER_TEMP/out"

      - name: Fetch and build MergeCode at the pinned commit
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/mergecode" && cd "$RUNNER_TEMP/mergecode"
          git init -q
          git fetch -q --depth 1 https://github.com/niravpatidar37/mergecode.git "$MERGECODE_SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$MERGECODE_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Install the base's pinned Rust toolchain (rust-toolchain.toml)
        run: cd "$RUNNER_TEMP/base" && rustup toolchain install

      - name: Judge
        id: judge
        run: |
          set +e
          node "$RUNNER_TEMP/mergecode/dist/cli.js" judge \
            --repo "$RUNNER_TEMP/base" \
            --task "$RUNNER_TEMP/task.md" \
            --patch "$RUNNER_TEMP/pr.diff" \
            --out "$RUNNER_TEMP/out"
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mergecode-report
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce verdict
        # 0 MERGE, 1 REQUEST_CHANGES (advisory), 2 REJECT, 3 error.
        env:
          EXIT_CODE: ${{ steps.judge.outputs.exit }}
        run: |
          if [ ! -s "$RUNNER_TEMP/out/report.md" ]; then
            echo "::error::MergeCode did not produce a report (exit '$EXIT_CODE')"; exit 1
          fi
          # A crash also exits non-zero: require run.json's verdict to agree with the exit code.
          VERDICT=$(node -e 'try { process.stdout.write(String(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).verdict)) } catch { process.stdout.write("missing") }' "$RUNNER_TEMP/out/run.json")
          case "$EXIT_CODE:$VERDICT" in
            0:MERGE|1:REQUEST_CHANGES) echo "MergeCode verdict: $VERDICT" ;;
            2:REJECT) echo "::error::MergeCode verdict: REJECT"; exit 1 ;;
            *) echo "::error::MergeCode exit code '$EXIT_CODE' does not match verdict '$VERDICT'"; exit 1 ;;
          esac

  comment:
    name: mergecode comment
    needs: judge
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.judge.result == 'success' || needs.judge.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # create/update the single sticky verdict comment
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: mergecode-report
          path: ${{ runner.temp }}/out

      - name: Post or update the verdict comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_DIR: ${{ runner.temp }}/out
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const marker = "<!-- mergecode-verdict -->";
            const file = path.join(process.env.REPORT_DIR, "report.md");
            // Produced in a job that ran PR code: treat as untrusted text.
            let report = fs.existsSync(file)
              ? fs.readFileSync(file, "utf8")
              : "# MergeCode\n\nThe judge did not produce a report. See the workflow logs.";
            // PR code ran in the job that wrote this file, so it may be forged even though
            // MergeCode renders it inert. Neutralise mentions, HTML, links and images again.
            report = report
              .replaceAll(marker, "")
              .replace(/@/g, "@\u200b")
              .replace(/</g, "&lt;")
              .replace(/\]\(/g, "]\u200b(")
              .replace(/:\/\//g, ":\u200b//")
              .replace(/\bwww\./gi, (m) => `${m.slice(0, 3)}\u200b.`)
              .slice(0, 60000);
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
