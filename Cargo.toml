[package]
name = "mcpsum"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "A reference monitor for MCP: serves tool definitions from a reviewed lockfile, enforces locked schemas, denies server-initiated sampling/elicitation, and fails closed."
readme = "README.md"
keywords = ["mcp", "security", "llm", "agents", "lockfile"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
# default-features = false: no remote/file $ref resolution. An attacker-controlled
# schema must never make us fetch URLs or read local files (SSRF / LFI).
jsonschema = { version = "0.58.5", default-features = false }
# Kill the whole server process tree, not just the direct child: process groups
# on Unix, Job Objects on Windows (spawned suspended, assigned, then resumed, so a
# grandchild cannot start outside the job). See src/process.rs and issue #7.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"

# Cross-process audit-log locks (src/filelock.rs). Same versions process-wrap
# and clap already pull in, so no new crates; replace with std File::try_lock
# once the MSRV reaches 1.89.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO"] }

[dev-dependencies]
proptest = "1.11.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
